<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قِسط | نظام إدارة الأقساط</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app-shell" id="appRoot">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">ق</div><div><b>قِسط</b><small>QEST BUSINESS</small></div></div>
    <div class="workspace"><span class="dot"></span><span>معرض الهدي</span><span class="chev">⌄</span></div>
    <nav>
      <p class="nav-label">الرئيسية</p>
      <button class="nav-item active" data-view="dashboard"><i>▦</i> لوحة التحكم</button>
      <p class="nav-label">إدارة الأعمال</p>
      <button class="nav-item" data-view="customers"><i>♙</i> العملاء <em id="customerCount">0</em></button>
      <button class="nav-item" data-view="contracts"><i>▤</i> العقود</button>
      <button class="nav-item" data-view="installments"><i>◉</i> الأقساط <em class="alert-count" id="overdueCount">0</em></button>
      <button class="nav-item" data-view="payments"><i>◈</i> المدفوعات</button>
      <p class="nav-label">التنظيم</p>
      <button class="nav-item" data-view="calendar"><i>□</i> التقويم</button>
      <button class="nav-item" data-view="reports"><i>▥</i> التقارير</button>
      <button class="nav-item" data-view="notifications"><i>♢</i> التنبيهات <em id="notifCount">0</em></button>
    </nav>
    <div class="sidebar-bottom"><div class="upgrade"><b>ارتقِ بإدارة أعمالك</b><span>احصل على تحليلات متقدمة</span><button>ترقية الآن</button></div><div class="profile"><div class="avatar">م</div><div><b>محمود خالد</b><small>مدير النظام</small></div><button id="settingsBtn">⚙</button></div></div>
  </aside>
  <main>
    <header class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="breadcrumbs"><b id="pageTitle">لوحة التحكم</b><span id="pageSubtitle">نظرة عامة على أداء أعمالك اليوم</span></div>
      <div class="top-actions"><button class="icon-btn" id="themeBtn" title="تغيير المظهر">☾</button><button class="icon-btn notif" data-view="notifications">♢<span id="topNotif">0</span></button><div class="date-box" id="today"></div></div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-backdrop"></div><div class="modal-card"><button class="modal-close">×</button><div id="modalContent"></div></div></div>
<div id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body></html>
